[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videosai"
version = "0.1.0"
description = "Automated feedback for content creators: analyze a video and get what works, what does not, and what to fix first"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["video", "analysis", "ffmpeg", "content-creators", "tiktok", "reels", "shorts"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
videosai = "videosai.cli:main"

[tool.setuptools.packages.find]
include = ["videosai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
